<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Gonçalo Oliveira — Computer Engineering Student</title>
  <desc id="heroDesc">A terminal window types whoami and shows Gonçalo Oliveira, Computer Engineering student. A small robot mascot named Bit floats beside the name.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #3fb950; }
    .cmd    { fill: #e6edf3; }
    .out-c  { fill: #58a6ff; }
    .out-a  { fill: #d29922; }
    .out-p  { fill: #bc8cff; }
    .dim    { fill: #8b949e; }

    @keyframes type {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 -2% 0 0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes eyes  { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }

    .t1 { animation: type 0.6s steps(6, end)  0.4s both; }
    .o1 { animation: rise 0.35s ease          1.2s both; }
    .t2 { animation: type 0.8s steps(11, end) 1.8s both; }
    .o2 { animation: rise 0.35s ease          2.8s both; }
    .t3 { animation: type 1.2s steps(24, end) 3.4s both; }
    .o3 { animation: rise 0.35s ease          4.8s both; }
    .p4 { animation: rise 0.2s ease           5.4s both; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .bit    { animation: floaty 4s ease-in-out infinite; }
    .ring   { animation: orbit 14s linear infinite; }
    .led, .thrust { animation: pulse 2.2s ease-in-out infinite; }
    .eye { animation: eyes 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {
      .t1,.t2,.t3,.o1,.o2,.o3,.p4,.cursor,.bit,.ring,.led,.thrust,.eye { animation: none; }
    }
  </style>

  <!-- card background (self-contained: looks right in light and dark mode) -->
  <rect x="1" y="1" width="878" height="298" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- ======================= terminal window ======================= -->
  <g>
    <rect x="24" y="24" width="500" height="252" rx="10" fill="#010409" stroke="#30363d"/>
    <rect x="24" y="24" width="500" height="34" rx="10" fill="#161b22"/>
    <rect x="24" y="48" width="500" height="10" fill="#161b22"/>
    <circle cx="46" cy="41" r="6" fill="#f85149"/>
    <circle cx="66" cy="41" r="6" fill="#d29922"/>
    <circle cx="86" cy="41" r="6" fill="#3fb950"/>
    <text x="274" y="45" text-anchor="middle" class="mono dim" font-size="12">goncalo@github: ~</text>

    <g class="mono" font-size="14">
      <text x="44" y="90"><tspan class="prompt">$ </tspan><tspan class="cmd t1">whoami</tspan></text>
      <text x="44" y="116" class="out-c o1">Gonçalo Oliveira · Computer Engineering student</text>

      <text x="44" y="142"><tspan class="prompt">$ </tspan><tspan class="cmd t2">cat now.txt</tspan></text>
      <text x="44" y="168" class="out-a o2">building · breaking · learning (mostly in that order)</text>

      <text x="44" y="194"><tspan class="prompt">$ </tspan><tspan class="cmd t3">./next_experiment --run</tspan></text>
      <text x="44" y="220" class="o3"><tspan class="out-p">loading curiosity </tspan><tspan class="dim">[██████████░░] </tspan><tspan class="out-p">never quite 100%</tspan></text>

      <text x="44" y="252" class="p4"><tspan class="prompt">$ </tspan><tspan class="cmd cursor">▊</tspan></text>
    </g>
  </g>

  <!-- ======================= right panel ======================= -->
  <text x="702" y="84" text-anchor="middle" class="sans" font-size="30" font-weight="700" fill="#e6edf3">Gonçalo Oliveira</text>
  <text x="702" y="110" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#58a6ff">Computer Engineering Student · Portugal</text>
  <text x="702" y="134" text-anchor="middle" class="sans" font-size="12" font-style="italic" fill="#8b949e">turning curiosity into code,</text>
  <text x="702" y="152" text-anchor="middle" class="sans" font-size="12" font-style="italic" fill="#8b949e">one experiment at a time</text>

  <!-- mascot: Bit -->
  <g transform="translate(702,218)">
    <g class="ring">
      <circle cx="58" cy="0" r="4" fill="#58a6ff"/>
      <circle cx="-29" cy="50" r="4" fill="#3fb950"/>
      <circle cx="-29" cy="-50" r="4" fill="#bc8cff"/>
    </g>
    <g class="bit">
      <line x1="0" y1="-25" x2="0" y2="-42" stroke="#8b949e" stroke-width="2"/>
      <circle cx="0" cy="-46" r="4" fill="#d29922" class="led"/>
      <rect x="-30" y="-25" width="60" height="50" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="-11" cy="-6" r="5" fill="#3fb950" class="eye"/>
      <circle cx="11" cy="-6" r="5" fill="#3fb950" class="eye"/>
      <path d="M -9 8 Q 0 15 9 8" stroke="#3fb950" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="-40" y="-8" width="8" height="18" rx="4" fill="#30363d"/>
      <rect x="32" y="-8" width="8" height="18" rx="4" fill="#30363d"/>
      <ellipse cx="0" cy="34" rx="16" ry="5" fill="#58a6ff" opacity="0.4" class="thrust"/>
    </g>
  </g>
</svg>
