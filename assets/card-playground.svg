<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-labelledby="c1t c1d">
  <title id="c1t">React and Node Playground — live experiment</title>
  <desc id="c1d">Next.js and TypeScript sandbox deployed on Vercel. Status: live demo.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    .led { animation: pulse 2s ease-in-out infinite; }
    .go  { animation: nudge 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .led,.go { animation: none; } }
  </style>
  <rect x="1" y="1" width="418" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="148" rx="4" fill="#58a6ff"/>
  <text x="28" y="34" class="sans" font-size="17" font-weight="700" fill="#e6edf3">React + Node Playground</text>
  <text x="28" y="52" class="mono" font-size="10" fill="#8b949e">SIDE QUEST · WEB EXPERIMENT</text>
  <text x="28" y="76" class="sans" font-size="12" fill="#c9d1d9">A Next.js + TypeScript sandbox for trying out React,</text>
  <text x="28" y="93" class="sans" font-size="12" fill="#c9d1d9">components and deployment on Vercel.</text>
  <g class="mono" font-size="10">
    <rect x="28" y="106" width="58" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="57" y="118" text-anchor="middle" fill="#58a6ff">Next.js</text>
    <rect x="92" y="106" width="80" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="132" y="118" text-anchor="middle" fill="#58a6ff">TypeScript</text>
    <rect x="178" y="106" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="205" y="118" text-anchor="middle" fill="#58a6ff">Vercel</text>
  </g>
  <circle cx="322" cy="30" r="5" fill="#3fb950" class="led"/>
  <text x="334" y="34" class="mono" font-size="11" fill="#3fb950">LIVE DEMO</text>
  <g class="go">
    <text x="360" y="120" class="mono" font-size="12" fill="#8b949e">open →</text>
  </g>
</svg>
