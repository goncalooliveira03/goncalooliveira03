<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240" role="img" aria-labelledby="mTitle mDesc">
  <title id="mTitle">Bit, the robot mascot, waving hello</title>
  <desc id="mDesc">A small friendly robot with an antenna floats and waves one arm.</desc>
  <style>
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes wave   { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-32deg); } 70% { transform: rotate(10deg); } }
    @keyframes pulse  { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes eyes   { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }
    @keyframes shade  { 0%, 100% { transform: scaleX(1); opacity: 0.35; } 50% { transform: scaleX(0.8); opacity: 0.2; } }
    .bit   { animation: floaty 4s ease-in-out infinite; }
    .arm-w { animation: wave 2.6s ease-in-out infinite; transform-origin: 176px 108px; }
    .led   { animation: pulse 2.2s ease-in-out infinite; }
    .eye   { animation: eyes 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .shadow{ animation: shade 4s ease-in-out infinite; transform-origin: 110px 218px; }
    @media (prefers-reduced-motion: reduce) { .bit,.arm-w,.led,.eye,.shadow { animation: none; } }
  </style>

  <ellipse cx="110" cy="218" rx="46" ry="9" fill="#58a6ff" class="shadow"/>

  <g class="bit">
    <!-- waving arm (behind body) -->
    <g class="arm-w">
      <rect x="168" y="96" width="12" height="42" rx="6" fill="#30363d" transform="rotate(150 176 108)"/>
      <circle cx="196" cy="76" r="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    </g>

    <!-- antenna -->
    <line x1="110" y1="62" x2="110" y2="36" stroke="#8b949e" stroke-width="3"/>
    <circle cx="110" cy="30" r="7" fill="#d29922" class="led"/>

    <!-- body -->
    <rect x="58" y="62" width="104" height="88" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <!-- face screen -->
    <rect x="72" y="76" width="76" height="46" rx="10" fill="#010409"/>
    <circle cx="94" cy="97" r="8" fill="#3fb950" class="eye"/>
    <circle cx="126" cy="97" r="8" fill="#3fb950" class="eye"/>
    <path d="M 96 110 Q 110 120 124 110" stroke="#3fb950" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- chest button -->
    <circle cx="110" cy="138" r="6" fill="#bc8cff"/>

    <!-- left arm -->
    <rect x="42" y="98" width="12" height="42" rx="6" fill="#30363d"/>
    <!-- legs -->
    <rect x="80" y="150" width="14" height="30" rx="7" fill="#30363d"/>
    <rect x="126" y="150" width="14" height="30" rx="7" fill="#30363d"/>
    <rect x="74" y="178" width="26" height="10" rx="5" fill="#58a6ff"/>
    <rect x="120" y="178" width="26" height="10" rx="5" fill="#58a6ff"/>
  </g>
</svg>
