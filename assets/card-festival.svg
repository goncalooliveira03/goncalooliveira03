<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-labelledby="c2t c2d">
  <title id="c2t">Festival Lineup — Django coursework</title>
  <desc id="c2d">Django app managing a music festival lineup with models, forms and admin. Status: completed.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    .led { animation: pulse 2s ease-in-out infinite; }
    .go  { animation: nudge 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .led,.go { animation: none; } }
  </style>
  <rect x="1" y="1" width="418" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="148" rx="4" fill="#3fb950"/>
  <text x="28" y="34" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Festival Lineup</text>
  <text x="28" y="52" class="mono" font-size="10" fill="#8b949e">MAIN QUEST · BACKEND COURSEWORK</text>
  <text x="28" y="76" class="sans" font-size="12" fill="#c9d1d9">Django app for a music festival lineup — models, forms,</text>
  <text x="28" y="93" class="sans" font-size="12" fill="#c9d1d9">admin and queryset ordering by date and time.</text>
  <g class="mono" font-size="10">
    <rect x="28" y="106" width="58" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="57" y="118" text-anchor="middle" fill="#3fb950">Python</text>
    <rect x="92" y="106" width="58" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="121" y="118" text-anchor="middle" fill="#3fb950">Django</text>
    <rect x="156" y="106" width="58" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="185" y="118" text-anchor="middle" fill="#3fb950">SQLite</text>
  </g>
  <circle cx="308" cy="30" r="5" fill="#58a6ff" class="led"/>
  <text x="320" y="34" class="mono" font-size="11" fill="#58a6ff">COMPLETED ✓</text>
  <g class="go">
    <text x="360" y="120" class="mono" font-size="12" fill="#8b949e">open →</text>
