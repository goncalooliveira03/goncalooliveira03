<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-labelledby="c3t c3d">
  <title id="c3t">Web Dev Lab Notebook — HTML, CSS and JavaScript labs</title>
  <desc id="c3d">Seven lab exercises exploring HTML, CSS and vanilla JavaScript, published on GitHub Pages.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    .led { animation: pulse 2s ease-in-out infinite; }
    .go  { animation: nudge 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .led,.go { animation: none; } }
  </style>
  <rect x="1" y="1" width="418" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="148" rx="4" fill="#bc8cff"/>
  <text x="28" y="34" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Web Dev Lab Notebook</text>
  <text x="28" y="52" class="mono" font-size="10" fill="#8b949e">TRAINING GROUNDS · FRONTEND LABS</text>
  <text x="28" y="76" class="sans" font-size="12" fill="#c9d1d9">Seven lab exercises exploring HTML, CSS and vanilla</text>
  <text x="28" y="93" class="sans" font-size="12" fill="#c9d1d9">JavaScript — published with GitHub Pages.</text>
  <g class="mono" font-size="10">
    <rect x="28" y="106" width="50" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="53" y="118" text-anchor="middle" fill="#bc8cff">HTML</text>
    <rect x="84" y="106" width="46" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="107" y="118" text-anchor="middle" fill="#bc8cff">CSS</text>
    <rect x="136" y="106" width="84" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="118" text-anchor="middle" fill="#bc8cff">JavaScript</text>
  </g>
  <circle cx="316" cy="30" r="5" fill="#bc8cff" class="led"/>
  <text x="328" y="34" class="mono" font-size="11" fill="#bc8cff">ON PAGES</text>
  <g class="go">
    <text x="360" y="120" class="mono" font-size="12" fill="#8b949e">open →</text>
  </g>
</svg>
