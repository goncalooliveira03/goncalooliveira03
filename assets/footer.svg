<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 110" width="880" height="110" role="img" aria-labelledby="fTitle fDesc">
  <title id="fTitle">End of transmission — thanks for visiting</title>
  <desc id="fDesc">A signal pulse travels along a circuit line above a thank-you message.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(760px); } }
    @keyframes pulse  { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .signal { animation: travel 6s linear infinite; }
    .node   { animation: pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .signal,.node { animation: none; } }
  </style>
  <rect x="1" y="1" width="878" height="108" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- circuit line -->
  <path d="M 40 40 H 320 L 340 25 H 420 L 440 40 H 560 L 575 55 H 700 L 715 40 H 840"
        stroke="#30363d" stroke-width="2" fill="none"/>
  <circle cx="40" cy="40" r="4" fill="#3fb950" class="node"/>
  <circle cx="840" cy="40" r="4" fill="#58a6ff" class="node"/>
  <g class="signal">
    <circle cx="46" cy="40" r="5" fill="#3fb950"/>
    <circle cx="46" cy="40" r="9" fill="#3fb950" opacity="0.25"/>
  </g>

  <text x="440" y="78" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">// end of transmission — thanks for stopping by</text>
  <text x="440" y="97" text-anchor="middle" class="mono" font-size="11" fill="#3fb950">$ git commit -m "thanks for visiting" &amp;&amp; git push</text>
</svg>
