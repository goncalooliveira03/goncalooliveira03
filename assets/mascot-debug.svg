<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240" role="img" aria-labelledby="mdTitle mdDesc">
  <title id="mdTitle">Bit, the robot mascot, debugging on a laptop</title>
  <desc id="mdDesc">The robot mascot types on a laptop while a small bug walks away from the screen.</desc>
  <style>
    @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    @keyframes glow   { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.6; } }
    @keyframes pulse  { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes eyes   { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }
    @keyframes crawl  { from { transform: translateX(0); } to { transform: translateX(70px); } }
    @keyframes fade   { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
    .hand-l { animation: typing 0.5s ease-in-out infinite; }
    .hand-r { animation: typing 0.5s ease-in-out 0.25s infinite; }
    .glow   { animation: glow 2.4s ease-in-out infinite; }
    .led    { animation: pulse 2.2s ease-in-out infinite; }
    .eye    { animation: eyes 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bug    { animation: crawl 6s linear infinite, fade 6s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hand-l,.hand-r,.glow,.led,.eye,.bug { animation: none; } }
  </style>

  <!-- antenna -->
  <line x1="110" y1="58" x2="110" y2="34" stroke="#8b949e" stroke-width="3"/>
  <circle cx="110" cy="28" r="7" fill="#f85149" class="led"/>

  <!-- body, slightly hunched -->
  <rect x="58" y="58" width="104" height="86" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <rect x="72" y="72" width="76" height="44" rx="10" fill="#010409"/>
  <circle cx="94" cy="92" r="8" fill="#d29922" class="eye"/>
  <circle cx="126" cy="92" r="8" fill="#d29922" class="eye"/>
  <!-- focused flat mouth -->
  <line x1="98" y1="107" x2="122" y2="107" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>

  <!-- laptop -->
  <g>
    <rect x="52" y="150" width="116" height="42" rx="6" fill="#30363d"/>
    <rect x="60" y="128" width="100" height="26" rx="4" fill="#010409" stroke="#58a6ff" stroke-width="2"/>
    <ellipse cx="110" cy="141" rx="56" ry="18" fill="#58a6ff" class="glow"/>
    <text x="68" y="146" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#3fb950">fix(bug): again…</text>
  </g>

  <!-- typing hands -->
  <circle cx="70" cy="156" r="9" fill="#161b22" stroke="#58a6ff" stroke-width="2" class="hand-l"/>
  <circle cx="150" cy="156" r="9" fill="#161b22" stroke="#58a6ff" stroke-width="2" class="hand-r"/>

  <!-- little bug escaping -->
  <g class="bug">
    <ellipse cx="70" cy="212" rx="8" ry="6" fill="#f85149"/>
    <circle cx="78" cy="210" r="3" fill="#010409"/>
    <line x1="64" y1="217" x2="60" y2="221" stroke="#f85149" stroke-width="2"/>
    <line x1="70" y1="218" x2="68" y2="223" stroke="#f85149" stroke-width="2"/>
    <line x1="76" y1="217" x2="78" y2="222" stroke="#f85149" stroke-width="2"/>
  </g>
  <text x="110" y="232" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-style="italic" fill="#8b949e">one bug always gets away</text>
</svg>
