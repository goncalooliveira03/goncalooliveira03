<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-labelledby="c4t c4d">
  <title id="c4t">Django App Collection — coursework mini-apps</title>
  <desc id="c4d">A bundle of Django mini-apps built for class: blog, store, gym, recipes and more. Status: in progress.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    .led { animation: pulse 2s ease-in-out infinite; }
    .go  { animation: nudge 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .led,.go { animation: none; } }
  </style>
  <rect x="1" y="1" width="418" height="148" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="148" rx="4" fill="#d29922"/>
  <text x="28" y="34" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Django App Collection</text>
  <text x="28" y="52" class="mono" font-size="10" fill="#8b949e">QUEST LOG · BACKEND COURSEWORK</text>
  <text x="28" y="76" class="sans" font-size="12" fill="#c9d1d9">A bundle of Django mini-apps built for class — blog,</text>
  <text x="28" y="93" class="sans" font-size="12" fill="#c9d1d9">store, gym, recipes… one repo, many first attempts.</text>
  <g class="mono" font-size="10">
    <rect x="28" y="106" width="58" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="57" y="118" text-anchor="middle" fill="#d29922">Python</text>
    <rect x="92" y="106" width="58" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="121" y="118" text-anchor="middle" fill="#d29922">Django</text>
    <rect x="156" y="106" width="84" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="198" y="118" text-anchor="middle" fill="#d29922">JavaScript</text>
  </g>
  <circle cx="300" cy="30" r="5" fill="#d29922" class="led"/>
  <text x="312" y="34" class="mono" font-size="11" fill="#d29922">IN PROGRESS</text>
  <g class="go">
    <text x="360" y="120" class="mono" font-size="12" fill="#8b949e">open →</text>
  </g>
</svg>
